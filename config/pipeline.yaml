data_dir: data
output_dir: artifacts

extraction:
  min_text_chars_before_ocr: 1200
  use_docling: auto        # auto | always | never
  ocr_languages: ["vi", "en"]
  ocr_use_gpu: false      # CPU OCR is safer/stabler on 4GB GPUs
  document_timeout_seconds: 600
  # A timed-out worker leaves completed page caches. Retry resumes from them.
  document_timeout_attempts: 3
  # Cheap checks run on every page. OCR remains selective; visual previews are
  # rendered only for suspicious pages and are bounded per document.
  page_max_replacement_fraction: 0.02
  page_max_control_fraction: 0.01
  page_min_alnum_fraction: 0.45
  page_max_dominant_character_fraction: 0.35
  page_max_duplicate_line_fraction: 0.60
  page_compare_min_chars: 80
  page_min_native_ocr_token_dice: 0.35
  page_quality_render_previews: true
  page_quality_max_previews_per_document: 12
  page_quality_preview_dpi: 96

cleaning:
  unicode_form: NFC
  repeated_line_page_ratio: 0.55
  repeated_line_max_chars: 120

parsing:
  keep_unparsed_preamble: true
  minimum_provision_chars: 10

knowledge:
  checklist_mode: heuristic   # heuristic | ollama | hybrid_ai | ai
  ollama_model: qwen3:4b
  case_ontology_mode: heuristic # heuristic | ai
  ai_provider: ollama           # ollama | http (OpenAI-compatible)
  ai_url: http://127.0.0.1:11434/api/chat
  ai_model: qwen3:8b
  ai_timeout_seconds: 300
  # Keep verified structured responses in exported artifacts so a later build can resume.
  ai_cache_dir: artifacts/04_knowledge/ai_cache
  # hybrid_ai refines only the strongest deterministic rule candidates and is hard-bounded.
  ai_max_provisions: 2000
  issue_min_score: 1
  relation_confidence_threshold: 0.55

retrieval:
  embedding_model: BAAI/bge-m3
  embedding_model_path: .cache/models/bge-m3
  embedding_device: auto
  embedding_batch_size: 4
  embedding_chunk_size: 128
  embedding_max_length: 1024
  embedding_use_fp16: true
  bm25_method: lucene
  case_knn_k: 3
  community_algorithm: leiden

neo4j:
  load_batch_size: 500
