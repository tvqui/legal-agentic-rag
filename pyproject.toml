[project]
name = "vn-labor-legal-rag"
version = "0.3.0"
description = "Grounded Vietnamese labor-law data construction and Legal GraphRAG system"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pymupdf>=1.26.0",
  "beautifulsoup4>=4.13.0",
  "python-docx>=1.2.0",
  "pyyaml>=6.0.2",
  "pydantic>=2.10.0",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "tqdm>=4.67.0",
  "regex>=2025.0.0",
  "networkx>=3.4",
  "scikit-learn>=1.6",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.50.0",
]
ocr = [
  "docling>=2.50.0",
  "easyocr>=1.7.2",
]
retrieval = [
  "FlagEmbedding>=1.3.5",
  "faiss-cpu>=1.11.0",
  "bm25s>=0.2.14",
]
graph = [
  "neo4j>=6.0.0",
  "python-dotenv>=1.1.0",
]
llm = [
  "ollama>=0.6.0",
]
community = [
  "python-igraph>=0.11.8",
  "leidenalg>=0.10.2",
]
online = [
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "httpx>=0.28.0",
]
full = [
  "docling>=2.50.0",
  "easyocr>=1.7.2",
  "FlagEmbedding>=1.3.5",
  "faiss-cpu>=1.11.0",
  "bm25s>=0.2.14",
  "neo4j>=6.0.0",
  "python-dotenv>=1.1.0",
  "ollama>=0.6.0",
  "python-igraph>=0.11.8",
  "leidenalg>=0.10.2",
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "httpx>=0.28.0",
]

[project.scripts]
vn-labor-offline = "vn_labor_offline.cli:main"
vn-labor-source-resolver = "vn_labor_offline.source_resolver.cli:main"
vn-labor-online = "vn_labor_online.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vn_labor_offline", "src/vn_labor_online"]
